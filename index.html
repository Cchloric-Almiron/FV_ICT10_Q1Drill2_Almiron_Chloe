<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with numbers</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&" rel="stylesheet">

    <style>

        body{
            background-image: url("https://i.pinimg.com/1200x/cd/4f/79/cd4f798f183649bc13d2f5a751c96433.jpg");
            background-repeat:no-repeat;
            background-size:cover;
            background-position:center;
        }

        #MainB{
            background-color:#a7333fb1;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:"Jost", sans-serif;
            margin-top:100px;
            height:300px;
            width:400px;
            border-left:rgb(85, 8, 8) solid 10px;
            border-radius:30px;
            padding:20px;
            box-shadow:2px 2px rgba(89, 2, 2, 0.947);
            
        }

        input[type="text"]{
            padding:10px;
            width:300px;
            background-color:#74121D;
            outline:none;
            color:#FFFFFF;
            border:none;
            border-radius:20px;
        }

        input[type="button"]{
            padding:5px;
            width:90px;
            background-color:#74121D;
            outline:none;
            color:#e2e2e2;
            border:none;
            border-radius:20px;

        }

        input[type="number"]{
            padding:5px;
            width:300px;
            background-color:#74121D;
            outline:none;
            color:#e2e2e2;
            border:none;
            border-radius:20px;

        }

        #CalcB{
            background-color:#a7333fb1;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:"Jost", sans-serif;
            margin-top:50px;
            height:600px;
            width:400px;
            border-left:rgb(85, 8, 8) solid 10px;
            border-radius:30px;
            padding:20px;
            box-shadow:10px 10px rgba(89, 2, 2, 0.947);
            margin-bottom:50px;
        }

        #results{
            background-color:#74121D;
            justify-content:center;
            align-items:center;
            font-family:"Jost", sans-serif;
            height:150px;
            width:350px;
            border-radius:50px;
            text-align:center;
            padding:50px;
            border:2px dashed #430a11;
              
        }
    </style>

</head>
<body>

    <center>
    <div id="MainB">
    <form>

        <h1>Welcome!</h1>

        <input type="text" id="user_input" placeholder="Enter your username">
        <br><br>
        <input type="button" py-click="greetings" value="Sign-in">

        <br>

        <div id="result" style="color:#ffffff; font-size:20px;"></div>
        <py-script src="main.py"></py-script>
        

    </form>
    </div>
    </center>

    <center>
    <div id="CalcB">
    <form>

        <h1>Calculator</h1>

        <input type="number" id="num1" placeholder="Enter the first number">
        <br><br>
        <input type="number" id="num2" placeholder="Enter the second number">
        <br><br>
        <input type="button" py-dblclick="adding_numbers" value="Add">
        <input type="button" py-click="subtracting_numbers" value="Subtract">
        <input type="button" py-click="multiplying_numbers" value="Multiply">
        <input type="button" py-click="dividing_numbers" value="Divide">
        <input type="button" py-click="floor_dividing_numbers" value="FloorDivide">
        <input type="button" py-click="moduling_numbers" value="Moduling">
        <input type="button" py-click="exponential_numbers" value="Exponential">
        <input type="button" onclick="window.location.reload()" value="Clear">

        <br><br>

        <h2>Results:</h2>
        <div id="results" style="color:#ffffff; font-size:20px;"></div>
        <py-script src="main.py"></py-script>

    </form>

    </div>
    </center>
</body>
</html>
    </div>
    </center>
</body>
</html>
